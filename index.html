<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JohnVon Shows</title>
<meta name="description" content="Where JohnVon is playing next in Tampa Bay. Add every show to your calendar.">
<meta property="og:title" content="JohnVon Shows">
<meta property="og:description" content="Where JohnVon is playing next in Tampa Bay.">
<meta name="theme-color" content="#0b0a0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap">
<style>
/* Public fan hub: one column, thumb-sized buttons, every show one tap from the calendar. */
:root{--ink:#f5f3f7;--muted:#b9b3c4;--ground:#0b0a0e;--panel:#17141f;--line:rgba(255,255,255,.14);--gold:#ffd84d;--lilac:#b18cff;
--display:"Archivo Black","Inter",system-ui,sans-serif;--ui:"Inter",system-ui,-apple-system,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);line-height:1.45;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-size:44px;line-height:1;margin:0;letter-spacing:-.01em}
.tag{color:var(--muted);margin:6px 0 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-family:var(--display);font-size:17px;
  border-radius:16px;padding:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:center}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1400}
.btn.lilac{background:var(--lilac);border-color:var(--lilac);color:#140b22}
.btn:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.show{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:12px}
.when{display:flex;gap:14px;align-items:center}
.date{min-width:64px;text-align:center;border-radius:14px;background:rgba(255,216,77,.12);border:1px solid rgba(255,216,77,.35);padding:8px 6px}
.date b{display:block;font-family:var(--display);font-size:26px;line-height:1}.date span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.show h2{font-family:var(--display);font-size:24px;line-height:1.1;margin:0}
.meta{color:var(--muted);font-size:14px;margin:2px 0 0}
.note{margin:0}
.follow{display:flex;gap:10px}.follow .btn{flex:1;font-size:15px;padding:14px}
.small{color:var(--muted);font-size:13px;text-align:center;margin:0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:92vh;overflow-y:auto}
.panel h3{font-family:var(--display);font-size:26px;line-height:1.05;margin:0}
.panel .for{color:var(--gold);font-weight:600;margin:0}
.panel label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.panel input{font:16px var(--ui);color:var(--ink);background:#0f0d14;border:1px solid var(--line);border-radius:12px;padding:13px 12px}
.panel input:focus-visible{outline:3px solid var(--lilac);outline-offset:1px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{font:600 15px var(--ui);color:var(--ink);background:#0f0d14;border:1px solid var(--line);border-radius:12px;padding:12px 0;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1400}
.btn[disabled]{opacity:.5}.err{color:#ff8a95;font-size:14px;margin:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.done{text-align:center;display:grid;gap:10px;padding:10px 0}.done b{font-family:var(--display);font-size:28px}
#gl-body{display:grid;gap:14px}.panel [hidden]{display:none!important}
.close{justify-self:end;background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:4px}

</style>
</head>
<body>
<main>
  <header>
    <h1>JohnVon</h1>
    <p class="tag" id="tag">Tampa Bay house music</p>
  </header>
  <div class="row" id="subrow" hidden><a class="btn lilac" id="subscribe" href="#">Follow shows (iPhone)</a><a class="btn lilac" id="subscribe-g" href="#">Follow shows (Google)</a></div>
  <section id="shows" aria-label="Upcoming shows"><p class="empty">Loading shows...</p></section>
  <a class="btn" id="book" href="#" hidden>Book JohnVon for your venue or event</a>
  <div class="follow">
    <a class="btn" id="tiktok" href="#">TikTok</a>
    <a class="btn" id="instagram" href="#">Instagram</a>
  </div>
  <p class="small">Tampa · St. Pete · Ybor</p>
</main>
<div class="sheet" id="gl" hidden role="dialog" aria-modal="true" aria-labelledby="gl-title">
  <form class="panel" id="gl-form" novalidate>
    <button type="button" class="close" id="gl-close">Close</button>
    <div id="gl-body">
      <h3 id="gl-title">JohnVon's Guest List</h3>
      <p class="for" id="gl-for"></p>
      <label>Your name<input name="name" autocomplete="name" required maxlength="80" placeholder="First and last"></label>
      <label>How many in your group (including you)<div class="seg" data-k="party"><button type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button">4</button><button type="button">5+</button></div></label>
      <label>Reminder on show day<div class="seg three" data-k="reminder"><button type="button">Text me</button><button type="button">Email me</button><button type="button">No thanks</button></div></label>
      <label id="gl-contact-wrap" hidden><span id="gl-contact-label">Phone number</span><input name="contact" maxlength="120" id="gl-contact"></label>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="err" id="gl-err" hidden></p>
      <button class="btn gold" type="submit" id="gl-send">Put me on the list</button>
      <p class="small">Your name only goes to the door. Never shared or posted.</p>
    </div>
  </form>
</div>
<script>
(async function () {
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  let d;
  try { d = await (await fetch('shows.json', {cache: 'no-store'})).json(); }
  catch (e) { document.getElementById('shows').innerHTML = '<p class="empty">Shows will be back in a moment.</p>'; return; }
  const set = (id, url) => { const a = document.getElementById(id); if (url) { a.href = url; a.hidden = false; } else a.hidden = true; };
  document.getElementById('tag').textContent = d.tagline || '';
  set('subscribe', d.calendar_subscribe); set('subscribe-g', d.calendar_google); document.getElementById('subrow').hidden = !(d.calendar_subscribe || d.calendar_google); set('book', d.booking_form); set('tiktok', d.links.tiktok); set('instagram', d.links.instagram);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const shows = (d.shows || []).filter(s => new Date(s.date + 'T23:59:59') >= today).sort((a, b) => a.date.localeCompare(b.date));
  const ymd = s => s.replace(/-/g, '');
  const next = s => { const t = new Date(s + 'T12:00:00'); t.setDate(t.getDate() + 1); return t.toISOString().slice(0, 10).replace(/-/g, ''); };
  const gcal = s => 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(`JohnVon at ${s.name}`) +
    `&dates=${ymd(s.date)}/${next(s.date)}&location=` + encodeURIComponent(`${s.venue}, ${s.address}`) +
    '&details=' + encodeURIComponent(`${s.note || ''} Set time: ${s.time}. More: ${location.href}`);
  const ics = s => 'data:text/calendar;charset=utf-8,' + encodeURIComponent(['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//JohnVon//Shows//EN', 'BEGIN:VEVENT',
    `UID:${s.id}@johnvon`, `DTSTART;VALUE=DATE:${ymd(s.date)}`, `DTEND;VALUE=DATE:${next(s.date)}`, `SUMMARY:JohnVon at ${s.name}`,
    `LOCATION:${s.venue}\\, ${s.address.replace(/,/g, '\\,')}`, `DESCRIPTION:Set time ${s.time}. ${location.href}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n'));
  const rsvp = s => d.rsvp_form ? d.rsvp_form.replace('{show}', encodeURIComponent(`${s.name} (${s.date})`)) : '';
  const box = document.getElementById('shows');
  if (!shows.length) { box.innerHTML = '<p class="empty">New shows coming soon. Tap above to get them on your calendar.</p>'; return; }
  box.innerHTML = shows.map(s => {
    const dt = new Date(s.date + 'T12:00:00');
    const mon = dt.toLocaleDateString('en-US', {month: 'short'}), day = dt.getDate(), wk = dt.toLocaleDateString('en-US', {weekday: 'long'});
    return `<article class="show">
      <div class="when"><div class="date"><span>${esc(mon)}</span><b>${day}</b></div>
        <div><h2>${esc(s.name)}</h2><p class="meta">${esc(wk)} · ${esc(s.time === 'TBA' ? 'Set time TBA' : s.time)}</p>
        <p class="meta">${esc(s.venue)}</p></div></div>
      ${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}
      ${d.guestlist ? `<button type="button" class="btn gold" data-gl="${esc(s.id)}">Get on JohnVon's guest list</button>` : (rsvp(s) ? `<a class="btn gold" href="${esc(rsvp(s))}">I'm coming</a>` : '')}
      <div class="row"><a class="btn" href="${esc(gcal(s))}">Google Calendar</a><a class="btn" href="${esc(ics(s))}" download="johnvon-${esc(s.id)}.ics">Apple Calendar</a></div>
      ${s.map ? `<a class="btn" href="${esc(s.map)}">Directions</a>` : ''}
    </article>`;
  }).join('');
  // Guest list: our own form, Google Forms stores it (no Google screens for the guest). Names never shown publicly.
  const gl = document.getElementById('gl'), form = document.getElementById('gl-form'), err = document.getElementById('gl-err');
  const pick = {party: '', reminder: ''}; let cur = null;
  form.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => {
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => { seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); pick[seg.dataset.k] = b.textContent;
      if (seg.dataset.k === 'reminder') { const w = document.getElementById('gl-contact-wrap'), inp = document.getElementById('gl-contact');
        w.hidden = b.textContent === 'No thanks'; document.getElementById('gl-contact-label').textContent = b.textContent === 'Email me' ? 'Email' : 'Phone number';
        inp.type = b.textContent === 'Email me' ? 'email' : 'tel'; inp.autocomplete = b.textContent === 'Email me' ? 'email' : 'tel'; } };
  }));
  const open = s => { cur = s; document.getElementById('gl-for').textContent = `${s.name} · ${s.venue} · ${new Date(s.date + 'T12:00:00').toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric'})} · ${s.time}`;
    err.hidden = true; gl.hidden = false; form.name.focus(); };
  document.getElementById('gl-close').onclick = () => { gl.hidden = true; };
  gl.onclick = e => { if (e.target === gl) gl.hidden = true; };
  box.querySelectorAll('[data-gl]').forEach(b => b.onclick = () => open(shows.find(s => s.id === b.dataset.gl)));
  form.onsubmit = async e => {
    e.preventDefault(); err.hidden = true;
    const name = form.name.value.trim(), contact = (document.getElementById('gl-contact').value || '').trim();
    const bad = !name ? 'Add your name.' : !pick.party ? 'How many in your group?' : !pick.reminder ? 'Pick a reminder option.' :
      (pick.reminder !== 'No thanks' && !contact) ? 'Add where to send the reminder.' : '';
    if (bad) { err.textContent = bad; err.hidden = false; return; }
    if (form.website.value) return;   // bot
    const f = d.guestlist.fields, body = new URLSearchParams();
    body.append(f.show, `${cur.name} at ${cur.venue} (${cur.date}) [${cur.id}]`); body.append(f.name, name);
    body.append(f.party, pick.party); body.append(f.reminder, pick.reminder); body.append(f.contact, pick.reminder === 'No thanks' ? '' : contact);
    const btn = document.getElementById('gl-send'); btn.disabled = true; btn.textContent = 'Adding you...';
    try {
      await fetch(d.guestlist.action, {method: 'POST', mode: 'no-cors', body});
      document.getElementById('gl-body').innerHTML = `<div class="done"><b>You're on the list.</b><p>${esc(name)}${pick.party !== '1' ? ` + ${pick.party === '5+' ? '4 or more' : (Number(pick.party) - 1)}` : ''}<br>${esc(cur.venue)} · ${esc(cur.time)}</p><p class="small">Give your name at the door.</p></div>`;
    } catch (x) { err.textContent = 'Could not send. Check your connection and try again.'; err.hidden = false; btn.disabled = false; btn.textContent = 'Put me on the list'; }
  };
})();
</script>
</body>
</html>
